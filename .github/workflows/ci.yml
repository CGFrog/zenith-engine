name: CI

on:
  push:
  pull_request:

jobs:
  build-test-package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxkbcommon-dev libwayland-dev wayland-protocols libasound2-dev libpulse-dev libudev-dev
      - name: Install macOS Vulkan portability runtime
        if: runner.os == 'macOS'
        run: brew install molten-vk
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -DZENITH_WINDOWS_INSTALLER=${{ runner.os == 'Windows' }}
      - name: Build
        run: cmake --build build --config Release --parallel 4
      # Every GPU test carries the vulkan label, including the vulkan;validation
      # strict matrix, so runners without a GPU only run CPU coverage here.
      - name: Run CPU tests
        run: ctest --test-dir build -C Release --output-on-failure -LE vulkan
      - name: Run bounded Vulkan smoke test
        if: runner.os == 'Windows'
        continue-on-error: true
        run: ctest --test-dir build -C Release --output-on-failure -L vulkan -LE validation
      # Strict validation runs exit 77 (reported as skipped) when the Vulkan
      # loader or VK_LAYER_KHRONOS_validation is unavailable on the runner.
      - name: Run strict Vulkan validation smoke matrix
        if: runner.os == 'Windows'
        continue-on-error: true
        run: ctest --test-dir build -C Release --output-on-failure -L validation
      - name: Package
        run: cmake --build build --config Release --target package --parallel 4
      - name: Verify clean extraction
        if: runner.os != 'macOS'
        shell: pwsh
        run: |
          $archive = Get-ChildItem build -File | Where-Object { $_.Extension -in '.zip', '.gz' } | Select-Object -First 1
          if (-not $archive) { throw 'Package archive was not produced' }
          cmake -DZENITH_ARCHIVE="$($archive.FullName)" -DZENITH_VERIFY_ROOT="$($PWD.Path)/clean extraction with spaces" -P cmake/VerifyExtractedPackage.cmake
      - name: Verify macOS application bundle
        if: runner.os == 'macOS'
        run: |
          cmake --install build --config Release --prefix "$PWD/clean bundle with spaces"
          ZENITH_RESOURCE_ROOT="$PWD/clean bundle with spaces" "$PWD/clean bundle with spaces/Zenith.app/Contents/MacOS/Zenith" --verify-package --project "$PWD/clean bundle with spaces/demo.zenith-project"
      - uses: actions/upload-artifact@v4
        with:
          name: zenith-${{ runner.os }}
          path: |
            build/*.zip
            build/*.msi
            build/*.tar.gz
            build/*.deb
            build/*.dmg
