name: CI

on:
  push:
  pull_request:

jobs:
  # Fast documentation checks, independent of the build: every Markdown link
  # resolves, and the generated parts of the docs match the sources
  # (tools/docs/*.py; run them without --check to regenerate).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Markdown links
        run: python tools/docs/check_links.py
      - name: Check every source file has a summary and the code map's source index is current
        run: python tools/docs/code_index.py --check
      - name: Check the screenshot checklist is current
        run: python tools/docs/screenshot_checklist.py --check
      - name: Check the tests follow docs/TESTING.md
        run: python tools/tests/check_tests.py
  build-test-package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # SDL's X11 extensions (XScrnSaver, XTest, XFixes) are required unless
        # SDL is configured without them; see SDL's README-linux.
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libxfixes-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libdrm-dev libgbm-dev libdbus-1-dev libasound2-dev libpulse-dev libudev-dev
      - name: Install macOS Vulkan portability runtime
        if: runner.os == 'macOS'
        run: brew install molten-vk
      # Linux runs its Vulkan tests on lavapipe (below), several times slower
      # than a GPU, so its test timeouts are scaled.
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -DZENITH_WINDOWS_INSTALLER=${{ runner.os == 'Windows' }} -DZENITH_TEST_TIMEOUT_SCALE=${{ runner.os == 'Linux' && 4 || 1 }}
      - name: Build
        run: cmake --build build --config Release --parallel 4
      # The cpu tier (docs/TESTING.md, the `cpu` test preset): unit and slow
      # tests, never vulkan or benchmark ones.
      - name: Run CPU tests
        run: ctest --test-dir build -C Release --output-on-failure -L "^(unit|slow)$" -LE "^benchmark$"
      # Linux runners have no GPU: Mesa's lavapipe runs the Vulkan tests on the
      # CPU under Xvfb. The validation layer comes from the LunarG SDK, since
      # Ubuntu 24.04's packaged one (1.3.275) crashes on Vulkan 1.4 core push
      # descriptors. Reference captures skip themselves on a software device,
      # and the strict validation matrix (minutes per run on lavapipe) stays
      # Windows-only.
      - name: Install Linux software Vulkan driver and validation layer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y mesa-vulkan-drivers xvfb
          curl -fsSL -o vulkan_sdk.tar.xz "https://sdk.lunarg.com/sdk/download/1.4.363.0/linux/vulkan_sdk.tar.xz"
          mkdir -p "$RUNNER_TEMP/vulkan-sdk"
          tar -xJf vulkan_sdk.tar.xz -C "$RUNNER_TEMP/vulkan-sdk" --wildcards '*/x86_64/lib/libVkLayer_khronos_validation.so' '*/x86_64/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json'
          rm vulkan_sdk.tar.xz
          echo "VK_ADD_LAYER_PATH=$RUNNER_TEMP/vulkan-sdk/1.4.363.0/x86_64/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
      - name: Run Vulkan smoke tests on lavapipe
        if: runner.os == 'Linux'
        continue-on-error: true
        run: xvfb-run -a -s "-screen 0 1600x900x24" ctest --test-dir build -C Release --output-on-failure -L vulkan -LE "validation|benchmark"
      - name: Run bounded Vulkan smoke test
        if: runner.os == 'Windows'
        continue-on-error: true
        run: ctest --test-dir build -C Release --output-on-failure -L vulkan -LE validation
      # Strict validation runs exit 77 (reported as skipped) when the Vulkan
      # loader or VK_LAYER_KHRONOS_validation is unavailable on the runner.
      - name: Run strict Vulkan validation smoke matrix
        if: runner.os == 'Windows'
        continue-on-error: true
        run: ctest --test-dir build -C Release --output-on-failure -L validation
      - name: Package
        run: cmake --build build --config Release --target package --parallel 4
      - name: Verify clean extraction
        if: runner.os != 'macOS'
        shell: pwsh
        run: |
          $archive = Get-ChildItem build -File | Where-Object { $_.Extension -in '.zip', '.gz' } | Select-Object -First 1
          if (-not $archive) { throw 'Package archive was not produced' }
          cmake -DZENITH_ARCHIVE="$($archive.FullName)" -DZENITH_VERIFY_ROOT="$($PWD.Path)/clean extraction with spaces" -P cmake/VerifyExtractedPackage.cmake
      - name: Verify macOS application bundle
        if: runner.os == 'macOS'
        run: |
          cmake --install build --config Release --prefix "$PWD/clean bundle with spaces"
          ZENITH_RESOURCE_ROOT="$PWD/clean bundle with spaces" "$PWD/clean bundle with spaces/Zenith.app/Contents/MacOS/Zenith" --verify-package --project "$PWD/clean bundle with spaces/demo.zenith-project"
      - uses: actions/upload-artifact@v4
        with:
          name: zenith-${{ runner.os }}
          path: |
            build/*.zip
            build/*.msi
            build/*.tar.gz
            build/*.deb
            build/*.dmg
